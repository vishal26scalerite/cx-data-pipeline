services:
  metabase:
    image: metabase/metabase:latest
    container_name: chat_dashboard_metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - chat_dashboard_metabase_data:/metabase-data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  chat_dashboard_metabase_data:

